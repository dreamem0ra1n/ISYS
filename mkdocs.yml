        - 汇编语言程序设计与调试: 专业选修/应用基础类/汇编语言程序设计与调试.md
        - 网络空间安全导论: 专业选修/应用基础类/网络空间安全导论.md
        - 数据库系统: 专业选修/应用基础类/数据库系统.md
        - 面向信息安全的信号处理: 专业选修/应用基础类/面向信息安全的信号处理.md
        - 多媒体安全: 专业选修/应用基础类/多媒体安全.md
      - 实践拓展类:
        - 社交网络安全与隐私: 专业选修/实践拓展类/社交网络安全与隐私.md
  - 实践教学:
