  - 专业进阶: 
      - 软件保护技术: 专业进阶/软件保护技术.md
      - 硬件安全基础: 专业进阶/硬件安全基础.md
      - 编程语言原理: 专业进阶/编程语言原理.md
      - 密码学进阶: 专业进阶/密码学进阶.md
      - 编译原理: 专业进阶/编译原理.md
      - 人工智能安全: 专业进阶/人工智能安全.md
      - 深度合成技术与电子取证: 专业进阶/深度合成技术与电子取证.md

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  font:
    code: JetBrains Mono
    text: JetBrains Mono
  palette:
    primary: cyan
    accent: light blue

  features:
    - navigation.sidebar
    - content.action.edit
    - content.code.copy
    - content.tabs
    - navigation.tracking
    - navigation.expand
    - navigation.top
    - navigation.footer

plugins:
  - search
  - git-revision-date-localized:
      type: date
      timezone: Asia/Shanghai
      locale: zh
      enable_creation_date: false



markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences